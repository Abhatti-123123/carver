[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futures_trend"
version = "0.2.0"
description = "Carver-style systematic futures: risk-scaled portfolio with trend-strength sizing"
authors = [{name = "Angad Bhatti"}]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.21",
  "scipy",
  "statsmodels",
  "yfinance",
  "pyarrow",
  "matplotlib",
  "python-pptx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "scripts*", "data*"]
